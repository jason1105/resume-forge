name: Build Resume Variants

on:
  push:
    branches:
      - main
    paths:
      - "data/resume.yml"
  workflow_dispatch:
    inputs:
      jd_text:
        description: "招聘 JD 全文（填了才生成定向版简历；留空只重建常规版本）"
        required: false
        type: string
      jd_title:
        description: "目标岗位名称（可选，会写进定向简历标题）"
        required: false
        type: string

permissions:
  issues: write   # 失败告警需要开 issue
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  build-resumes:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system + Python dependencies
        run: |
          # WeasyPrint 需要 pango/cairo；fonts-noto-cjk 保证 PDF 中文不乱码
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi-dev libcairo2 fonts-noto-cjk
          pip install --upgrade pip
          pip install openai pyyaml weasyprint markdown

      - name: Generate resume variants
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 过渡期保留 OpenRouter 兜底，切稳后可删
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          # JD 定向：仅在手动触发并填写 jd_text 时生成定向版简历
          JD_TEXT: ${{ github.event.inputs.jd_text }}
          JD_TITLE: ${{ github.event.inputs.jd_title }}
        run: |
          python scripts/build_resumes.py

      - name: Generate PDF variants
        env:
          # 固定时间戳 → PDF 可复现，内容不变不产生二进制 churn
          SOURCE_DATE_EPOCH: "1735689600"
        run: |
          python scripts/md_to_pdf.py

      - name: Commit generated output
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-regenerate resume variants [skip ci]"
            # --- 改造：bot 不再直推 main，改为开 PR 并自动合并 ---
            git fetch origin main --depth=1 -q
            if [ -z "$(git log FETCH_HEAD..HEAD --oneline)" ]; then
              echo "No new commits; nothing to do."
              exit 0
            fi
            BRANCH="bot/$(date -u +%Y%m%d-%H%M%S)"
            git push -u origin "HEAD:$BRANCH"
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            gh pr create --base main --head "$BRANCH" \
              --title "$(git log -1 --pretty=%s)" \
              --body "Automated update by workflow: ${{ github.workflow }}"
            gh pr merge "$BRANCH" --squash --delete-branch
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ 工作流 ${{ github.workflow }} 运行失败"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="[${{ github.workflow }}]($RUN_URL) 于 $(date -u '+%Y-%m-%d %H:%M UTC') 失败（分支 ${{ github.ref_name }}，触发 ${{ github.event_name }}）。请查看日志。"
          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create ci-failure --color d73a4a --description "自动化工作流失败告警" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label ci-failure 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY"
          fi
